name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  backend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: Backend
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 26
          cache: npm
          cache-dependency-path: Backend/package-lock.json

      - name: Instalar dependencias
        run: npm ci

      - name: Revisar vulnerabilidades (altas o criticas)
        run: npm audit --audit-level=high

      - name: Revisar sintaxis de todos los archivos JS
        run: |
          find . ../Frontend/assets/js -name "*.js" -not -path "./node_modules/*" -print0 \
            | xargs -0 -n1 node --check
